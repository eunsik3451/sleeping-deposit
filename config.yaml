as_of_date: 2026-12-10

cash:
  lookback_days: 90
  min_buffer_krw: 1000000
  min_idle_amount_krw: 5000000
  min_idle_days: 7
  min_sweep_krw: 1000000
  event_window_days: 14
  active_trader_buy_days: 4
  active_trader_window_days: 30   # 매매대기형 판단 구간 (스펙 6.4 "최근 30일")
  event_reinvest_ratio: 0.5       # 이벤트 유입 후 잔고 감소가 이 비율 미만이면 이벤트유입형
  term_rp_min_krw: 30000000
  krw_rp_rate: 0.0275         # 유진 챔피언CMA(RP형) 자유형 약정수익률 (2026-08-28 기준, 홈페이지)
  krw_deposit_rate: 0.006     # 유진 예탁금 이용료 100만원 초과분 (홈페이지)
  usd_rp_rate: 0.035          # 확인 필요: 외화 RP 금리는 홈페이지에 고시 없음
  usd_deposit_rate: 0.006     # 유진 외화 예탁금 이용료 $1,000 초과분 (홈페이지)
  pb_threshold_krw: 50000000
  pb_event_threshold_krw: 30000000

suitability:
  risk_profile_valid_days: 365   # 확인 필요: 회사 투자성향 진단 유효기간
  risk_matrix:                   # 확인 필요: 회사 성향-등급 매칭 기준
    안정형: [6]
    안정추구형: [5, 6]
    위험중립형: [4, 5, 6]
    적극투자형: [2, 3, 4, 5, 6]
    공격투자형: [1, 2, 3, 4, 5, 6]

notify:
  default_send_time: "10:00"
  night_start: "21:00"
  night_end: "08:00"
  max_per_week: 1
  max_per_month: 4
  renotify_days: 30
  renotify_growth: 0.5
  snooze_days: 30
  ad_prefix: "(광고)"            # 준법 검토 필요

overseas_tax:                    # R2 해외주식 양도세 (유진 계좌 손익 기준)
  basic_deduction_krw: 2500000   # 확인 필요: 해외주식 양도소득 기본공제
  tax_rate: 0.22                 # 확인 필요: 양도세율(지방세 포함)
  last_sell_date: 2026-12-29     # 확인 필요: 올해 결제되는 마지막 매도일
  pb_threshold_krw: 500000       # 절세액이 이 이상이면 PB 상담 대상

rights_offer:                    # R3 권리 안내 (유상증자 청약)
  notice_days: 14                # 청약 시작 며칠 전부터 알릴지
  pb_threshold_krw: 1000000      # 현재가 기준 차이가 이 이상이면 PB 상담 대상

maturity:                        # R4 만기 안내 (펀드·ELS)
  notice_days: 14                # 만기 며칠 전부터 알릴지
  pb_threshold_krw: 30000000     # 상환 예정 금액이 이 이상이면 PB 상담 대상

pension:                         # R5 연금저축 세액공제 (IRP는 유진 미취급이라 제외)
  annual_limit_krw: 6000000      # 확인 필요: 연금저축 세액공제 한도
  credit_rate: 0.132             # 확인 필요: 세액공제율
  credit_rate_low_income: 0.165  # 확인 필요: 총급여 5,500만원 이하
  start_month: 10                # 10~12월에만 알림
  deadline: 2026-12-31

market:                          # 시장 이슈 알림 (보유 종목 큰 등락·신용 담보 부족)
  big_move_pct: 0.10             # 하루 등락률 이 이상이면 연락 대상
  maintenance_ratio: 1.40        # 확인 필요: 신용 담보 유지비율 (미만이면 추가 담보 없으면 반대매매)
  warn_drop: 0.10                # 하락 여력(유지비율까지 남은 주가 하락폭)이 이보다 작으면 경고
  watch_drop: 0.20               # 이보다 작으면 주의. 안전 복귀 금액도 이 기준
  base_lag_days: 60              # 가상 보유 수량을 정하는 기준: 기준일 60거래일 전 종가에 매입했다고 가정

priority:
  urgent_days: 7
  max_cards_customer: 3

demo:
  seed: 42
  n_customers: 300
  history_days: 180
