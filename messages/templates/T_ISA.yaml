# R5 ISA 비과세 안내: 10~12월 처음 발견 + 연말 D-7. 광고성(ad): 계좌 입금 유도라 수신 동의가 필요하다 (준법 확인 필요)
# ISA에 담는 상품은 원금 손실이 날 수 있고 예금자보호 대상이 아님을 함께 알린다. 남은 한도는 이월됨을 숨기지 않는다
msg_type: ad

push:
  default:
    title: "ISA 비과세 혜택 챙기세요"
    body: "남은 한도 {remain}. 순이익 {tax_free}까지 비과세, 세금 최대 약 {amount} 절약 (원금손실 가능)"

kakao:
  default:
    title: "ISA 비과세 안내"
    body: |-
      {name}님, ISA 계좌의 올해 납입 한도가 남아 있어요.

      ■ 올해 납입: {paid} / 한도 {limit}
      ■ 남은 한도: {remain} (안 쓰면 다음 해로 이월)
      ■ 순이익 {tax_free}까지 비과세 → 일반 계좌보다 세금 최대 약 {amount} 절약
      ■ 비과세 한도를 넘는 이익은 {over_rate} 분리과세

      입금은 앱 > ISA에서 직접 하실 수 있어요. 의무가입 기간은 {min_years}이에요.
      ※ ISA에 담는 주식·펀드·ETF는 원금 손실이 날 수 있고 예금자보호 대상이 아니에요.

      무료 수신거부: 앱 > 설정 > 알림 설정

pb_queue:
  default:
    title: "[통화] {name}님 · ISA 비과세"
    body: |-
      [인사] 안녕하세요, {name}님. 유진투자증권 담당 PB입니다. 연말 절세 관련해 연락드렸습니다.
      [근거] 올해 유진 ISA에 {paid}을 넣으셨고, 연 납입 한도까지 {remain}이 남아 있습니다. ISA는 순이익 {tax_free}까지 비과세라 일반 계좌보다 세금을 최대 약 {amount} 덜 내실 수 있습니다.
      [제안] 남은 한도는 다음 해로 이월되지만, 일찍 넣을수록 비과세로 투자하는 기간이 길어집니다. 의무가입 기간은 {min_years}이고, ISA에 담는 주식·펀드·ETF는 원금 손실이 날 수 있으며 예금자보호 대상이 아니라는 점도 안내드립니다.
      [확인] 당분간 쓰실 계획이 없는 자금이 있으신가요?
      [안내] 입금과 상품 선택은 앱에서 직접 하실 수 있고, 어려우시면 지점 방문도 도와드리겠습니다.

# 카톡 메시지 API 데모용 짧은 버전 (텍스트 200자 제한, 제목 "(광고) …"은 발송 때 앞에 붙임)
kakao_short:
  default:
    title: "ISA 비과세 안내"
    body: |-
      {name}님, ISA 올해 납입 한도가 {remain} 남았어요.
      순이익 {tax_free}까지 비과세라 세금을 최대 약 {amount} 아낄 수 있어요.

      입금은 앱 > ISA에서 직접 하실 수 있어요.

      ※ ISA에 담는 상품은 원금 손실이 날 수 있어요.
      수신거부: 앱 > 설정 > 알림 설정
