# R2 해외주식 양도세: 처음 발견 + 마감 D-7. 정보성(info): 세금 사실만, 매도를 권유하지 않는다
msg_type: info

push:
  default:
    title: "해외주식 세금, 줄일 수 있어요"
    body: "평가손실 종목을 {deadline}까지 정리하면 올해 해외주식 세금이 약 {amount} 줄어요."
  subtype:
    tax_deduction_fill:
      title: "해외주식 공제가 남아 있어요"
      body: "올해 기본공제 {deduction_left}이 남았어요. {deadline}까지 이익을 확정하면 세금 없이 챙길 수 있어요."

kakao:
  default:
    title: "해외주식 세금 안내"
    body: |-
      [유진투자증권] 해외주식 세금 안내

      {name}님, 올해 유진 계좌 해외주식 실현이익은 {realized}이에요. 기본공제({deduction})를 넘는 이익에는 세금이 붙어요.

      ■ 평가손실 종목: {loss}
      ■ 올해 안에 손실을 확정하면 줄어드는 세금: 약 {amount}
      ■ 올해 결제되는 마지막 매도일: {deadline}

      매도를 권유하는 안내가 아니에요. 다른 증권사 손익은 빠져 있어요. 궁금하시면 담당 PB에게 물어보세요.
  subtype:
    tax_deduction_fill:
      title: "해외주식 공제 안내"
      body: |-
        [유진투자증권] 해외주식 세금 안내

        {name}님, 올해 유진 계좌 해외주식 실현이익은 {realized}이에요. 기본공제 {deduction} 중 {deduction_left}이 남아 있어요.

        ■ 평가이익 종목: {gain}
        ■ 공제 안에서 이익을 확정하면 아낄 수 있는 세금: 약 {amount}
        ■ 올해 결제되는 마지막 매도일: {deadline}

        매도를 권유하는 안내가 아니에요. 다른 증권사 손익은 빠져 있어요. 궁금하시면 담당 PB에게 물어보세요.

pb_queue:
  default:
    title: "[통화] {name}님 · {title}"
    body: |-
      [인사] 안녕하세요, {name}님. 유진투자증권 담당 PB입니다. 올해 해외주식 세금 관련해 알려드릴 내용이 있어 연락드렸습니다.
      [근거] 올해 유진 계좌 해외주식 실현이익이 {realized}이고, 평가손실 {loss}, 평가이익 {gain}인 종목이 있습니다. 계산상 올해 세금을 약 {amount} 줄일 수 있습니다.
      [제안] 종목을 정리할지는 고객님 판단입니다. 다른 증권사 손익까지 합쳐 보셔야 정확하니, 원하시면 함께 점검해 드리겠습니다.
      [확인] 다른 증권사에서도 올해 해외주식을 매도하신 적이 있으신가요?
      [안내] 매도는 {deadline}까지 하셔야 올해 결제됩니다. 주문은 앱에서 직접 하실 수 있습니다.
