# R5 연금저축 세액공제: 10~12월 처음 발견 + 마감 D-7. 광고성(ad): 납입 유도라 수신 동의가 필요하다 (준법 확인 필요)
# 연금저축계좌는 펀드·ETF에 투자하므로 원금 손실 가능성과 예금자보호 미적용을 함께 알린다
msg_type: ad

push:
  default:
    title: "연금저축 세액공제 챙기세요"
    body: "남은 공제 한도 {remain}. {deadline}까지 넣으면 약 {amount} 환급 (원금손실 가능)"

kakao:
  default:
    title: "연금저축 세액공제 안내"
    body: |-
      {name}님, 올해 연금저축 세액공제 한도가 남아 있어요.

      ■ 올해 납입: {paid} / 한도 {limit}
      ■ 남은 한도: {remain}
      ■ 다 채우면 돌려받는 세금: 약 {amount}
      ■ 마감: {deadline} 납입분까지

      입금은 앱 > 연금저축에서 직접 하실 수 있어요. 다른 금융사 납입분은 빠져 있어요.
      ※ 연금저축계좌는 펀드·ETF 등에 투자해 원금 손실이 날 수 있고 예금자보호 대상이 아니에요.

      무료 수신거부: 앱 > 설정 > 알림 설정

pb_queue:
  default:
    title: "[통화] {name}님 · 연금저축 세액공제"
    body: |-
      [인사] 안녕하세요, {name}님. 유진투자증권 담당 PB입니다. 연말 세액공제 관련해 연락드렸습니다.
      [근거] 올해 유진 연금저축에 {paid}을 넣으셨고, 한도까지 {remain}이 남아 있습니다. 다 채우시면 세금 약 {amount}을 돌려받으실 수 있습니다.
      [제안] 다른 금융사에 넣으신 금액이 있으면 한도가 줄어드니 함께 확인해 드리겠습니다. 연금저축계좌는 펀드·ETF 등에 투자해 원금 손실이 날 수 있고 예금자보호 대상이 아니라는 점도 안내드립니다.
      [확인] 올해 다른 곳에 연금저축을 넣으신 적이 있으신가요?
      [안내] 입금은 {deadline}까지 앱에서 직접 하실 수 있습니다.

# 카톡 메시지 API 데모용 짧은 버전 (텍스트 200자 제한, 제목 "(광고) …"은 발송 때 앞에 붙임)
kakao_short:
  default:
    title: "연금저축 세액공제 안내"
    body: |-
      {name}님, 올해 연금저축 세액공제 한도가 {remain} 남았어요.
      다 채우면 약 {amount}을 돌려받아요. ({deadline} 납입분까지)

      입금은 앱 > 연금저축에서 직접 하실 수 있어요.

      ※ 연금저축은 원금 손실이 날 수 있고 예금자보호 대상이 아니에요.
      수신거부: 앱 > 설정 > 알림 설정
