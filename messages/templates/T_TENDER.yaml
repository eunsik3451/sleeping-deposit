# R3 공개매수: 처음 발견 + 마감 D-7. 정보성(info): 보유 종목의 공개매수 사실과 차이 금액
msg_type: info

push:
  default:
    title: "{stock} 공개매수 진행 중"
    body: "보유 {qty} 기준 시장가보다 약 {amount} 더 받을 수 있어요. 청약은 {deadline}까지예요."

kakao:
  default:
    title: "공개매수 안내"
    body: |-
      [유진투자증권] 공개매수 안내

      {name}님이 보유하신 {stock} 공개매수가 진행 중이에요.

      ■ 보유 수량: {qty}
      ■ 공개매수가 {offer_price} / 현재가 {now}
      ■ 응하면 시장가보다 약 {amount} 더 받아요
      ■ 청약 마감: {deadline}

      청약이 많으면 일부만 사들일 수 있고, 세금이 붙을 수 있어요. 청약은 앱 > 공개매수에서 직접 하실 수 있어요.

pb_queue:
  default:
    title: "[통화] {name}님 · {stock} 공개매수"
    body: |-
      [인사] 안녕하세요, {name}님. 유진투자증권 담당 PB입니다. 보유하신 {stock} 공개매수 건으로 연락드렸습니다.
      [근거] {stock} {qty}를 보유 중이시고, 공개매수가는 {offer_price}, 현재가는 {now}입니다. 응하시면 시장가보다 약 {amount}을 더 받을 수 있습니다.
      [제안] 청약 수량이 많으면 일부만 매수될 수 있고 양도 관련 세금이 붙을 수 있어 함께 확인해 드리겠습니다.
      [확인] 이번 공개매수에 응하실 생각이 있으신가요?
      [안내] 청약은 {deadline}까지 앱에서 직접 하실 수 있고, 어려우시면 지점 방문도 도와드리겠습니다.
