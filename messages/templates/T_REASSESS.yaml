# 투자성향 진단이 만료되어 온라인 실행이 막힌 고객
# 정보성(info): 사실 + 진단 안내만. 상품명·금리·가입 권유 없음
msg_type: info

push:
  default:
    title: "투자성향 진단 기간이 지났어요"
    body: "예수금 {cash}이 {days}일째 그대로예요. 진단을 다시 받으면 운용 방법을 볼 수 있어요."
  plain:
    title: "{name}님, 진단을 다시 받아 주세요"
    body: "예수금 {cash}이 {days}일째 그대로예요. 앱에서 투자성향 진단을 다시 받아 보세요."

kakao:
  default:
    title: "투자성향 진단 안내"
    body: |-
      [유진투자증권] 계좌 알림

      {name}님, {diag_date}에 받으신 투자성향 진단의 유효기간이 지났어요.

      ■ 예수금 {cash}이 {days}일째 그대로예요
      ■ 지난 {lookback}일 놓친 이자: 약 {missed}

      진단을 다시 받으시면 쉬는 돈을 운용하는 방법을 앱에서 바로 볼 수 있어요.
      앱 > 투자성향 진단
