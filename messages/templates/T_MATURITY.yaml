# R4 만기 안내(펀드·ELS): 처음 발견 + 만기 D-7. 정보성(info): 만기 일정과 상환금이 쉬면 못 받는 이자만, 재투자를 권유하지 않는다
msg_type: info

push:
  default:
    title: "{kind} 만기가 다가와요"
    body: "{product_name} 만기가 {deadline}이에요. 상환금 {expected}을 어디에 둘지 미리 정해 보세요."

kakao:
  default:
    title: "만기 안내"
    body: |-
      [유진투자증권] 만기 안내

      {name}님이 보유하신 {product_name}의 만기가 다가와요.

      ■ 만기일: {deadline} ({days_left}일 남음)
      ■ 상환 예정 금액: {expected}
      ■ 상환금이 예수금으로 한 달 쉬면 못 받는 이자: 약 {amount}

      상환금은 예수금으로 들어와요. 쉬지 않게 미리 계획해 두시면 좋아요. 앱 > 잠자는 예수금 깨우기에서 확인할 수 있어요.

pb_queue:
  default:
    title: "[통화] {name}님 · {product_name} 만기"
    body: |-
      [인사] 안녕하세요, {name}님. 유진투자증권 담당 PB입니다. 보유하신 {product_name} 만기가 다가와 연락드렸습니다.
      [근거] 만기일은 {deadline}이고 상환 예정 금액은 {expected}입니다. 상환금이 예수금으로 한 달 그대로 있으면 약 {amount}의 이자를 받지 못합니다.
      [제안] 다시 투자하실지, 당분간 수시로 넣고 뺄 수 있는 곳에 두실지 고객님 계획을 먼저 여쭙고 맞는 방법을 안내드리겠습니다.
      [확인] 상환금은 어떻게 쓰실 계획이신가요?
      [안내] 결정하시면 앱에서 직접 진행하실 수 있고, 어려우시면 지점 방문도 도와드리겠습니다.
