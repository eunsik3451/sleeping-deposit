# 보유 종목이 하루 ±10% 이상 움직인 다음 날 아침. 정보성(info): 고객 본인 보유 종목의 사실만
# 사고팔기 권유·방향 단정 없음. 이유(뉴스)는 숫자 검사 때문에 문자에 넣지 않고 앱 화면에서 보여 준다
# (반대매매 위험 안내는 회사가 이미 고객에게 보내고 있어 여기서 만들지 않는다)
msg_type: info

push:
  default:
    title: "보유 종목이 크게 움직였어요"
    body: "{stock} 주가가 {move_date} 크게 {dir}. 앱에서 확인해 보세요."

kakao:
  default:
    title: "보유 종목 안내"
    body: |-
      [유진투자증권] 보유 종목 안내

      {name}님이 보유하신 {stock} 주가가 {move_date} 하루 동안 크게 {dir}.

      ■ 종가: {close} (전날 {prev_close})
      ■ 평가금액: {value} (하루 {delta})

      왜 움직였는지는 앱에서 볼 수 있어요. 사고팔기를 권하는 안내가 아니에요. 궁금한 점은 담당 PB에게 물어보세요.
