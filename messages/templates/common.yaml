# 트리거 파일에 없는 채널은 여기 블록을 쓴다.
# pb_queue는 고객에게 나가지 않는 PB 통화 스크립트 (인사 → 근거 → 제안 → 확인 질문).
# 문장 속 숫자는 전부 {값}으로만 넣는다. 직접 쓴 숫자는 validator가 막는다 ("1"만 허용).

pb_queue:
  default:
    title: "[통화] {name}님 · {title}"
    body: |-
      [인사] 안녕하세요, {name}님. 유진투자증권 담당 PB입니다. 계좌를 살펴보다 안내드릴 내용이 있어 연락드렸습니다.
      [근거] {title}. 최근 {lookback}일 중 하루에 가장 많이 쓰신 {buffer}은 남겨두고 계산해도 {idle}이 쉬고 있고, 지난 {lookback}일 동안 놓친 이자는 약 {missed}입니다.
      [제안] {offer}
      [확인] 이 자금은 언제쯤 쓰실 계획이신가요?
      [안내] 시작하기로 하시면 앱의 '잠자는 예수금 깨우기'에서 상품설명서를 확인하고 직접 가입하실 수 있습니다. 진행이 어려우시면 지점 방문도 도와드리겠습니다.

# 제안 문장: 유형(subtype) → 행동(action) 순서로 고른다
offer:
  active_trader: "예수금 자동 RP를 신청해 두시면 정하신 금액을 넘는 예수금만 RP에 들어가고, 매수하실 때 자동으로 빠져서 매매에 지장이 없습니다. 주식을 대신 사고팔지는 않습니다. RP·CMA(RP형)는 예금자보호법에 따라 보호되지 않는 상품이라는 점도 함께 안내드립니다."
  fx_idle: "환전하지 않고 달러 그대로 {product}에 {suggest}을 맡기실 수 있습니다. 금리는 연 {rate}, 위험등급은 {risk}입니다. RP·CMA(RP형)는 예금자보호법에 따라 보호되지 않는 상품이라는 점도 함께 안내드립니다."
  event_inflow: "재투자 계획이 있으시면 함께 살펴보고, 그 전까지는 수시로 넣고 뺄 수 있는 {product}(연 {rate})에 맡겨두시는 방법을 안내드리려 합니다. RP·CMA(RP형)는 예금자보호법에 따라 보호되지 않는 상품이라는 점도 함께 안내드립니다."
  rp_buy: "당분간 쓰실 계획이 없으시면 {product}에 {suggest}을 맡기시는 방법이 있습니다. 금리는 연 {rate}, 위험등급은 {risk}입니다. 필요한 만큼만 남기고 넘는 예수금만 RP에 넣어 두는 예수금 자동 RP도 신청하실 수 있습니다. RP·CMA(RP형)는 예금자보호법에 따라 보호되지 않는 상품이라는 점도 함께 안내드립니다."
  reassess: "투자성향 진단({diag_date})의 유효기간이 지나 지금은 온라인으로 바로 시작하실 수 없습니다. 통화로 진단을 다시 도와드리고 이자를 받을 수 있는 방법을 안내드리겠습니다."
  pb_consult: "고객님 투자성향에 맞는 방법을 상담으로 직접 찾아드리겠습니다."
