# R3 권리 안내(유상증자 청약): 처음 발견 + 마감 D-7. 정보성(info): 보유 종목의 권리와 마감일만, 청약을 권유하지 않는다
msg_type: info

push:
  default:
    title: "{stock} 유상증자 청약 안내"
    body: "보유 주식으로 신주 {shares}를 청약할 수 있어요. 마감은 {deadline}이에요."

kakao:
  default:
    title: "유상증자 청약 안내"
    body: |-
      [유진투자증권] 유상증자 청약 안내

      {name}님이 보유하신 {stock}의 유상증자 청약 일정이 있어요.

      ■ 보유 {qty} → 청약 가능 신주 {shares}
      ■ 청약가 {issue_price} / 현재가 {now}
      ■ 현재가 기준 차이: 약 {amount}
      ■ 청약 기간: {start} ~ {deadline}

      청약하지 않으면 신주를 받지 못해요. 주가는 바뀔 수 있으니 직접 판단해 주세요. 앱 > 권리 청약에서 확인할 수 있어요.

pb_queue:
  default:
    title: "[통화] {name}님 · {stock} 유상증자"
    body: |-
      [인사] 안녕하세요, {name}님. 유진투자증권 담당 PB입니다. 보유하신 {stock}의 유상증자 청약 일정을 알려드리려고 연락드렸습니다.
      [근거] {stock} {qty}를 보유 중이셔서 신주 {shares}를 청약하실 수 있습니다. 청약가는 {issue_price}, 현재가는 {now}로 현재가 기준 차이는 약 {amount}입니다.
      [제안] 청약 여부는 고객님 판단입니다. 청약하지 않으시면 신주를 받지 못하고, 주가가 바뀌면 차이도 달라진다는 점만 함께 알려드립니다.
      [확인] 이번 청약에 대해 궁금하신 점이 있으신가요?
      [안내] 청약은 {start}부터 {deadline}까지 앱에서 직접 하실 수 있고, 어려우시면 지점 방문도 도와드리겠습니다.
